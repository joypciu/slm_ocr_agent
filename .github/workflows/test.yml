name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest fastapi httpx python-multipart pymupdf pillow numpy opencv-python-headless
      - run: python -m pytest -q tests
      - run: node --check web/app.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi uvicorn httpx python-multipart pymupdf pillow numpy opencv-python-headless playwright==1.63.0
      - run: python -m playwright install --with-deps chromium
      - run: python e2e/workspace_browser.py
